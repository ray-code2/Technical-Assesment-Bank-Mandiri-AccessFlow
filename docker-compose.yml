services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: accessflow
      POSTGRES_USER: accessflow
      POSTGRES_PASSWORD: accessflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessflow -d accessflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://accessflow:accessflow@database:5432/accessflow
      JWT_SECRET: change-this-demo-secret-before-production-1234
      JWT_EXPIRES_IN: 8h
      PORT: 3000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8088}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
